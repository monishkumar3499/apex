name: Deploy APEX to AWS EC2

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the app directory
            cd ~/apex

            # Fetch the latest changes from git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Rebuild the Docker image
            docker build -t apex-app .

            # Stop and remove the existing container if running
            docker stop apex || true
            docker rm apex || true

            # Run the new container with production settings
            docker run -d --name apex \
              -p 3000:3000 \
              --restart always \
              --env-file frontend/.env \
              apex-app

            # Clean up old unused docker images to save disk space
            docker image prune -f

            echo "Deployment completed successfully!"
