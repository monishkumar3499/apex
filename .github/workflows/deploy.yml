name: Deploy Kairo to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  # -------------------------------------------------------------------------
  # Gate: nothing reaches EC2 that does not typecheck and pass its tests.
  # -------------------------------------------------------------------------
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        # Integration tests hit real upstreams and are opt-in (RUN_INTEGRATION=1).
        run: npm test

      - name: Production build
        working-directory: frontend
        env:
          # Placeholders only. The build must not depend on real credentials -
          # this step exists to catch compile errors, not to produce an artifact.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ssh-action injects every name listed in `envs` as an unquoted,
      # single-line `export NAME=VALUE`. ENV_FILE is a whole .env file, so the
      # remote shell kept only its first line and then tried to *execute* the
      # rest - leaving a one-line frontend/.env on the host and a deploy that
      # fails its health check for missing config. Base64 reduces it to one
      # token with no shell metacharacters, which survives that injection.
      - name: Encode the env file for transport
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -n "${ENV_FILE:-}" ]; then
            encoded="$(printf '%s' "$ENV_FILE" | base64 -w0)"
            echo "::add-mask::$encoded"
            echo "ENV_FILE_B64=$encoded" >> "$GITHUB_ENV"
            echo "ENV_FILE secret encoded for transport."
          else
            echo "ENV_FILE_B64=" >> "$GITHUB_ENV"
            echo "No ENV_FILE secret set - the host's existing frontend/.env will be reused."
          fi

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_B64: ${{ env.ENV_FILE_B64 }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Passed as an env var rather than interpolated into the script body,
          # so a ref name can never be read as shell syntax.
          TARGET_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_B64,SUPABASE_URL,SUPABASE_ANON_KEY,TARGET_REF
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Accept either directory name: the host was provisioned as
            # ~/apex before the rename to Kairo, and a deploy must not depend on
            # someone having renamed it by hand first.
            #
            # Tested with [ -d ], not ls. `ls -d ~/kairo ~/apex` exits non-zero
            # the moment ONE of the two is missing - the normal case - and under
            # `set -euo pipefail` that killed the deploy on its very first
            # command, before the message below could ever print.
            REPO_DIR=""
            for candidate in "$HOME/kairo" "$HOME/apex"; do
              if [ -d "$candidate/.git" ]; then
                REPO_DIR="$candidate"
                break
              fi
            done

            if [ -z "$REPO_DIR" ]; then
              echo "No git checkout found at ~/kairo or ~/apex on the host."
              exit 1
            fi

            cd "$REPO_DIR"
            echo "Deploying $TARGET_REF into $REPO_DIR"

            # FETCH_HEAD rather than origin/$TARGET_REF: a single-ref fetch only
            # updates the remote-tracking branch when the clone carries the
            # default refspec, so a host cloned with --single-branch would
            # otherwise reset to a stale commit and "succeed".
            git fetch --prune origin "$TARGET_REF"
            git reset --hard FETCH_HEAD

            # Restored from the base64 produced by the encode step above.
            if [ -n "${ENV_FILE_B64:-}" ]; then
              umask 077
              printf '%s' "$ENV_FILE_B64" | base64 -d > frontend/.env
              chmod 600 frontend/.env
              echo "Synced frontend/.env securely from GitHub Secrets."
            fi

            # Fall back to the values already in frontend/.env on the host, so a
            # deploy still works before the repository secrets are populated.
            #
            # The trailing `|| true` is load-bearing: grep exits 1 when the key
            # is absent, and under pipefail that aborted the script instead of
            # reaching the explanatory error below.
            if [ -z "${SUPABASE_URL:-}" ] && [ -f frontend/.env ]; then
              SUPABASE_URL="$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' frontend/.env | head -1 | cut -d= -f2- | tr -d '\042\047' || true)"
            fi
            if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -f frontend/.env ]; then
              SUPABASE_ANON_KEY="$(grep -E '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' frontend/.env | head -1 | cut -d= -f2- | tr -d '\042\047' || true)"
            fi

            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
              echo "Refusing to build: the public Supabase credentials are unavailable."
              echo "Set NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY as repository"
              echo "secrets, or make sure frontend/.env on the host defines them."
              exit 1
            fi

            # A Next build wants ~2GB and the image tree is large. Record what
            # the host had to work with: an OOM kill or a full disk otherwise
            # surfaces only as a bare non-zero exit from docker build.
            echo "Host resources before build:"
            df -h "$REPO_DIR" | tail -1 || true
            free -m 2>/dev/null | head -2 || true

            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --build-arg NEXT_PUBLIC_DEMO_MODE=false \
              -t kairo-app:new .

            # Only retire the running container once the new image exists, so a
            # failed build leaves the previous version serving.
            #
            # Both names are stopped: the pre-rename container is called `apex`
            # and still holds port 3000, so retiring only `kairo` would leave it
            # running and the new container would fail to bind.
            for name in kairo apex; do
              docker stop "$name" || true
              docker rm "$name" || true
            done
            docker tag kairo-app:new kairo-app:latest

            docker run -d --name kairo \
              -p 3000:3000 \
              --restart always \
              --env-file frontend/.env \
              kairo-app:latest

            # Wait for the health endpoint before calling the deploy good.
            for attempt in $(seq 1 30); do
              status_code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:3000/api/health || echo "000")
              if [ "$status_code" = "200" ]; then
                echo "Health check passed on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check never passed (last status: $status_code)."
                echo "Health check response was:"
                cat /tmp/health.json || true
                echo "Recent container logs:"
                docker logs --tail 60 kairo || true
                exit 1
              fi
              sleep 2
            done

            docker image prune -f

            echo "Deployment completed successfully!"
